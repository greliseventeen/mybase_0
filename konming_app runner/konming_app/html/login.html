<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孔明 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        * {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #F5F5F5 0%, #E8E8E8 100%);
        }
        
        .landscape-bg {
            background-image: 
                radial-gradient(ellipse at 20% 80%, rgba(197, 155, 39, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(196, 30, 58, 0.03) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='600' height='600' viewBox='0 0 600 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C59B27' fill-opacity='0.02'%3E%3Cpath d='M300 300c0-165.69-134.31-300-300-300v300h300zM600 0c-165.69 0-300 134.31-300 300h300V0zM300 600c0-165.69 134.31-300 300-300v300H300zM0 300c165.69 0 300-134.31 300-300H0v300z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        .checkbox-custom {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #BDBDBD;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        
        .checkbox-custom:checked {
            background-color: #C41E3A;
            border-color: #C41E3A;
        }
        
        .checkbox-custom:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="landscape-bg w-[412px] bg-[#F5F5F5] rounded-3xl shadow-2xl overflow-hidden">
        <div class="min-h-[896px] px-8 py-12 flex flex-col">
            <div class="flex-1 flex flex-col justify-center">
                <div class="text-center mb-12">
                    <div class="w-28 h-28 mx-auto mb-6 rounded-full bg-gradient-to-br from-[#C41E3A] to-[#E54B5F] flex items-center justify-center shadow-lg">
                        <div class="w-24 h-24 rounded-full bg-white flex items-center justify-center">
                            <span class="text-[#C41E3A] text-4xl font-bold">孔</span>
                        </div>
                    </div>
                    <h1 class="text-[28px] font-bold text-[#1A1A1A] tracking-wide">孔明</h1>
                    <p class="text-[#757575] text-sm mt-2">国家政策学习平台</p>
                </div>
                
                <div class="space-y-5">
                    <div>
                        <div class="relative">
                            <input 
                                type="text" 
                                placeholder="用户名/手机号" 
                                class="w-full px-5 py-4 rounded-xl border-2 border-red-500 bg-white text-[#1A1A1A] text-[14px] focus:outline-none focus:border-[#C41E3A] transition-colors"
                            >
                        </div>
                    </div>
                    
                    <div>
                        <div class="relative">
                            <input 
                                type="password" 
                                placeholder="密码" 
                                class="w-full px-5 py-4 rounded-xl border-2 border-red-500 bg-white text-[#1A1A1A] text-[14px] focus:outline-none focus:border-[#C41E3A] transition-colors"
                            >
                        </div>
                        <p class="text-red-500 text-xs mt-2">账号或密码错误</p>
                    </div>
                    
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="checkbox-custom">
                        <label for="remember" class="ml-2 text-[#757575] text-[13px] cursor-pointer">记住密码</label>
                    </div>
                    
                    <button class="w-full py-4 bg-[#C41E3A] text-white font-semibold text-[16px] rounded-xl shadow-lg hover:bg-[#A01830] active:scale-[0.98] transition-all duration-200">
                        登录
                    </button>
                </div>
            </div>
            
            <div class="text-center pb-8">
                <p class="text-[#757575] text-sm">
                    还没有账号？
                    <a href="#" class="text-[#C41E3A] font-semibold hover:underline">注册账号</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
